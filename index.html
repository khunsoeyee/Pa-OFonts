<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar TTF Font Collection</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Padauk', sans-serif;
        }

        body {
            /* နောက်ခံပုံ bg.jpg ကို Website တစ်ခုလုံးမှာ Fixed တပ်ဆင်ခြင်း */
            background-image: url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Dark overlay to make text and cards pop over bg.jpg */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65); /* နောက်ခံပုံ ပိုကြည်အောင် ၆၅% မှောင်ပေးထားပါသည် */
            z-index: -1;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-align: center;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        /* Container for Font List */
        .font-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 850px;
        }

        /* Single Line Font Item Row (Glassmorphism design) */
        .font-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08); /* မှန်ကြည်ဒီဇိုင်း */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .font-row:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateX(4px);
        }

        /* Download Button at the FRONT (Left Side) */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0; /* ခလုတ် ဆိုဒ်မသေးသွားစေရန် */
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .download-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Preview Text Area (Right Side) */
        .font-preview {
            flex: 1;
            font-size: 1.8rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            line-height: 1.3;
        }

        /* Custom Fonts Settings */
        @font-face {
            font-family: 'FontOne';
            src: url('fonts/font1.ttf') format('truetype');
        }

        @font-face {
            font-family: 'FontTwo';
            src: url('fonts/font2.ttf') format('truetype');
        }

        /* Font styles application */
        .font-style-1 { font-family: 'FontOne', sans-serif; }
        .font-style-2 { font-family: 'FontTwo', sans-serif; }

        /* Responsive Settings for Mobile */
        @media (max-width: 480px) {
            .font-row {
                padding: 8px 12px;
                gap: 10px;
            }
            .download-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .font-preview {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <h1>Myanmar Free TTF Fonts</h1>

    <div class="font-container">

        <!-- ဖောင့် ၁ ခုချင်းစီအတွက် Row -->
        <div class="font-row">
            <!-- ၁။ Download Button (ရှေ့တွင်ထားသည်) -->
            <a href="fonts/font1.ttf" download class="download-btn">
                <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
                </svg>
                ဒေါင်းလုဒ်
            </a>

            <!-- ၂။ ဖောင့်နမူနာ စာကြောင်း (ညာဘက်တွင်ထားသည်) -->
            <div class="font-preview font-style-1">ပအိုဝ်ႏလိတ်ဖြုံႏတရေꩻ</div>
        </div>

        <!-- ဖောင့် ၂ -->
        <div class="font-row">
            <a href="fonts/font2.ttf" download class="download-btn">
                <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
                </svg>
                ဒေါင်းလုဒ်
            </a>
            <div class="font-preview font-style-2">ပအိုဝ်ႏလိတ်ဖြုံႏတရေꩻ</div>
        </div>

        <!-- ဖောင့်များလာပါက ဒီအတိုင်း <div class="font-row">...</div> ကို ကူးပြီး ထပ်တိုးသွားရုံပါပဲ -->

    </div>

</body>
</html>
