<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar TTF Font Collection</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Padauk', sans-serif;
        }

        body {
            background-image: url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            z-index: -1;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-align: center;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        }

        .font-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 850px;
        }

        .font-row {
            display: flex;
            align-items: center;
            justify-content: space-between; /* ဘယ်ညာ ညီညီညာညာ ခွဲပေးသည် */
            gap: 15px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .font-row:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateX(4px);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .download-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .preview-img {
            height: 45px;
            object-fit: contain;
            max-width: 100%;
        }

        @media (max-width: 480px) {
            .font-row {
                padding: 8px 12px;
                gap: 10px;
            }
            .download-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .preview-img {
                height: 35px;
            }
        }
    </style>
</head>
<body>

    <h1>Myanmar Free TTF Fonts</h1>

    <div class="font-container">

        <!-- Font Row 1 -->
        <div class="font-row">
            <!-- ၁။ စာလုံးပုံ (ဘယ်ဘက်တွင်ထားသည်) -->
            <img src="images/preview1.png" alt="Font Preview" class="preview-img">

            <!-- ၂။ ဒေါင်းလုဒ် ခလုတ် (ညာဘက်သို့ ရွှေ့ထားသည်) -->
            <a href="font/font1.ttf" download class="download-btn">
                <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
                </svg>
                ဒေါင်းလုဒ်
            </a>
        </div>

    </div>

</body>
</html>
